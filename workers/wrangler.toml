name = "mina-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"
keep_vars = true

routes = [
  { pattern = "api.minaedu.tw/*", zone_name = "minaedu.tw" }
]

# Encrypted Secrets（透過 wrangler secret put 設定，不在此檔案出現值）
# wrangler secret put NOTION_API_KEY
# wrangler secret put NOTION_BOOKING_DB_ID
# wrangler secret put NOTION_NEWS_DB_ID
# wrangler secret put NOTION_FAQ_DB_ID
# wrangler secret put NOTION_PRACTICE_DB_ID
# wrangler secret put NOTION_EXAM_REVIEW_DB_ID
# wrangler secret put LINE_OFFICIAL_URL
# wrangler secret put N8N_BOOKING_WEBHOOK
# wrangler secret put N8N_REGEN_WEBHOOK
# wrangler secret put N8N_PUBLISHER_WEBHOOK
# wrangler secret put ADMIN_SECRET
# wrangler secret put NOTION_EXAM_REVIEW_PARENT_PAGE_ID
# wrangler secret put CORS_ORIGIN

[[kv_namespaces]]
binding = "KV_SETTINGS"
id = "4aac88420d7b4561ab7738e121c83edd"

[[kv_namespaces]]
binding = "KV_CACHE"
id = "a6fe2450115f44f793c0c452d18fcb78"

[[kv_namespaces]]
binding = "KV_RATE_LIMIT"
id = "f8738779d110465584fd34031c7ecba1"

[vars]
ENVIRONMENT = "production"

[env.production]
vars = { ENVIRONMENT = "production" }

[env.staging]
vars = { ENVIRONMENT = "staging" }
