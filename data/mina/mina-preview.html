<style>
:root {
  --pink: #E60D85;
  --pink-d: #b8005f;
  --pink-bg: #fff0f8;
  --yellow: #FBD526;
  --green: #00B900;
  --blue: #4285F4;
  --text: #1a1a1a;
  --text2: #555;
  --border: #e8e8e8;
  --bg: #f4f4f6;
  --white: #fff;
  --r: 16px;
  --shadow: 0 4px 32px rgba(0,0,0,0.09);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans TC', 'PingFang TC', sans-serif;
  background: var(--bg);
  min-height: 100vh;
  padding: 24px 16px 40px;
}

/* ── TOP BAR ── */
.top-bar {
  max-width: 520px;
  margin: 0 auto 20px;
}
.top-bar h1 {
  font-size: 14px;
  color: var(--text2);
  margin-bottom: 12px;
  font-weight: 500;
  letter-spacing: 0.02em;
}
.page-pills {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.page-pill {
  padding: 6px 14px;
  border-radius: 20px;
  border: 2px solid var(--border);
  background: var(--white);
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  color: var(--text2);
  transition: all .18s;
}
.page-pill:hover { border-color: var(--pink); color: var(--pink); }
.page-pill.active {
  border-color: var(--pink);
  background: var(--pink-bg);
  color: var(--pink);
}

/* ── WIDGET ── */
.widget {
  max-width: 520px;
  margin: 0 auto;
  background: var(--white);
  border-radius: 20px;
  box-shadow: var(--shadow);
  overflow: hidden;
}

/* header */
.w-head {
  background: var(--pink);
  padding: 14px 18px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.w-av {
  width: 38px; height: 38px;
  background: rgba(255,255,255,0.25);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; font-weight: 700; color: #fff;
  flex-shrink: 0;
}
.w-info { color: #fff; }
.w-name { font-size: 15px; font-weight: 700; }
.w-status { font-size: 12px; opacity: .85; display: flex; align-items: center; gap: 5px; }
.dot { width: 7px; height: 7px; background: #a8ffb8; border-radius: 50%; display: inline-block; }

/* chat body */
.w-chat {
  padding: 20px 18px 8px;
  min-height: 120px;
  max-height: 420px;
  overflow-y: auto;
  scroll-behavior: smooth;
}

/* bubble */
.bubble-row {
  display: flex;
  gap: 10px;
  margin-bottom: 14px;
  animation: fadeUp .25s ease;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}
.b-av {
  width: 30px; height: 30px;
  background: var(--pink);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; color: #fff;
  flex-shrink: 0; margin-top: 2px;
}
.b-text {
  background: var(--pink-bg);
  border-radius: 4px 14px 14px 14px;
  padding: 11px 15px;
  font-size: 14px;
  line-height: 1.65;
  color: var(--text);
  max-width: 380px;
  white-space: pre-wrap;
  word-break: break-word;
}

/* user choice bubble */
.user-row {
  display: flex;
  justify-content: flex-end;
  margin-bottom: 10px;
  animation: fadeUp .2s ease;
}
.u-text {
  background: var(--pink);
  color: #fff;
  border-radius: 14px 4px 14px 14px;
  padding: 9px 14px;
  font-size: 13px;
  max-width: 280px;
}

/* options */
.w-options {
  padding: 6px 18px 16px;
  display: flex;
  flex-direction: column;
  gap: 7px;
}
.opt-btn {
  width: 100%;
  text-align: left;
  padding: 10px 15px;
  border: 1.5px solid var(--border);
  border-radius: 12px;
  background: var(--white);
  cursor: pointer;
  font-size: 14px;
  color: var(--text);
  transition: all .15s;
  font-family: inherit;
}
.opt-btn:hover {
  border-color: var(--pink);
  color: var(--pink);
  background: var(--pink-bg);
  transform: translateX(2px);
}

/* CTA */
.w-cta {
  padding: 0 18px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.cta-btn {
  display: block;
  width: 100%;
  padding: 12px 16px;
  border-radius: 12px;
  text-align: center;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  font-family: inherit;
  text-decoration: none;
  transition: opacity .15s, transform .15s;
}
.cta-btn:hover { opacity: .88; transform: translateY(-1px); }
.cta-trial { background: var(--pink); color: #fff; }
.cta-line  { background: var(--green); color: #fff; }
.cta-phone { background: var(--white); color: var(--text); border: 1.5px solid var(--border); }
.cta-map   { background: var(--white); color: var(--blue); border: 1.5px solid var(--blue); }

/* Article links */
.w-articles {
  padding: 0 18px 10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.art-lbl {
  font-size: 11px;
  color: var(--text2);
  margin-bottom: 2px;
  padding-left: 2px;
}
.art-link {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 13px;
  border: 1px solid var(--border);
  border-radius: 10px;
  font-size: 13px;
  text-decoration: none;
  color: var(--text);
  transition: all .15s;
}
.art-link:hover { border-color: var(--pink); color: var(--pink); }

/* divider */
.w-divider {
  height: 1px;
  background: var(--border);
  margin: 0 18px 12px;
}

/* quiz result tag */
.quiz-tag {
  display: inline-block;
  background: var(--yellow);
  color: var(--text);
  font-size: 11px;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: 20px;
  margin: 0 18px 10px;
}

/* restart */
.w-foot {
  padding: 4px 18px 14px;
  text-align: center;
}
.restart-btn {
  background: none;
  border: none;
  color: var(--text2);
  font-size: 12px;
  cursor: pointer;
  text-decoration: underline;
  font-family: inherit;
}

/* node path debug */
.debug {
  max-width: 520px;
  margin: 10px auto 0;
  font-size: 11px;
  color: #aaa;
  text-align: center;
}
</style>

function restart() {
  chat.innerHTML = '';
  interactive.innerHTML = '';
  history = [];
  const startNode = nodes[flows[currentFlow]];
  renderNode(startNode);
}

function renderNode(node) {
  history.push(node.id);
  debugEl.textContent = 'path: ' + history.join(' → ');

  // Mina bubble
  addMinaBubble(node.text);

  // Quiz result tag
  if (node.type === 'quiz_result') {
    const tag = document.createElement('div');
    tag.className = 'quiz-tag';
    tag.textContent = '🔍 題庫篩選觸發 filter: ' + JSON.stringify(node.filter);
    interactive.appendChild(tag);
  }

  // Clear interactive area
  const oldInter = document.getElementById('interactive');
  oldInter.innerHTML = '';
  if (node.type === 'quiz_result') {
    const tag2 = document.createElement('div');
    tag2.className = 'quiz-tag';
    tag2.textContent = '🔍 前端篩選題庫 → subject:' + node.filter.subject + ' grade:' + node.filter.grade;
    oldInter.appendChild(tag2);
  }

  if (node.type === 'options' || node.type === 'quiz_result') {
    // Show option buttons
    const opts = document.createElement('div');
    opts.className = 'w-options';
    node.options.forEach(o => {
      const btn = document.createElement('button');
      btn.className = 'opt-btn';
      btn.textContent = o.label;
      btn.onclick = () => {
        addUserBubble(o.label);
        opts.style.display = 'none';
        const next = nodes[o.next];
        if (next) renderNode(next);
      };
      opts.appendChild(btn);
    });
    oldInter.appendChild(opts);
  }

  if (node.type === 'answer' || node.type === 'quiz_result') {
    if (node.cta && node.cta.length > 0) {
      if (node.type === 'answer') {
        const div = document.createElement('div');
        div.className = 'w-divider';
        oldInter.appendChild(div);
      }
      const ctaDiv = document.createElement('div');
      ctaDiv.className = 'w-cta';
      node.cta.forEach(key => {
        const c = globalCta[key];
        if (!c) return;
        const btn = document.createElement('a');
        btn.className = 'cta-btn cta-' + key;
        btn.textContent = c.label;
        btn.href = c.url;
        btn.target = '_blank';
        ctaDiv.appendChild(btn);
      });
      oldInter.appendChild(ctaDiv);
    }

    if (node.articles && node.articles.length > 0) {
      const artDiv = document.createElement('div');
      artDiv.className = 'w-articles';
      const lbl = document.createElement('div');
      lbl.className = 'art-lbl';
      lbl.textContent = '相關課程介紹';
      artDiv.appendChild(lbl);
      node.articles.forEach(key => {
        const a = globalArticles[key];
        if (!a) return;
        const link = document.createElement('a');
        link.className = 'art-link';
        link.textContent = a.label;
        link.href = a.url;
        link.target = '_blank';
        artDiv.appendChild(link);
      });
      oldInter.appendChild(artDiv);
    }
  }

  // scroll to bottom
  setTimeout(() => chat.scrollTop = chat.scrollHeight, 100);
}

function addMinaBubble(text) {
  const row = document.createElement('div');
  row.className = 'bubble-row';
  row.innerHTML = `<div class="b-av">M</div><div class="b-text">${escHtml(text)}</div>`;
  chat.appendChild(row);
  setTimeout(() => chat.scrollTop = chat.scrollHeight, 50);
}

function addUserBubble(text) {
  const row = document.createElement('div');
  row.className = 'user-row';
  row.innerHTML = `<div class="u-text">${escHtml(text)}</div>`;
  chat.appendChild(row);
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

// Init
restart();
